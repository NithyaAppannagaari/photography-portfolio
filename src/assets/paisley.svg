<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <rect width="640" height="640" fill="#541028"/>
  <defs>
    <symbol id="buta" viewBox="0 0 120 200">
      <path fill="currentColor" d="M78 12c14 16 32 46 29 86-4 42-24 74-50 90-24 14-46-2-48-28-2-30 12-50 10-76-2-28-16-44-4-62 14-20 32-8 40 10 6 14-6-2 4-18 10-16 14-16 19-2z"/>
      <path fill="#F6EFE3" fill-opacity=".9" d="M76 42c12 16 18 44 12 72-6 26-22 44-36 48-12-10-16-34-10-58 6-24 8-44 18-56 6-6 12-10 16-6z"/>
      <circle cx="64" cy="96" r="5.2" fill="#E8B54A"/>
      <circle cx="64" cy="96" r="2.1" fill="#541028"/>
      <path d="M50 122c10 12 26 12 34-2" fill="none" stroke="#146E66" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="buta-line" viewBox="0 0 120 200">
      <path fill="none" stroke="#E8B54A" stroke-width="2.3" d="M78 12c14 16 32 46 29 86-4 42-24 74-50 90-24 14-46-2-48-28-2-30 12-50 10-76-2-28-16-44-4-62 14-20 32-8 40 10 6 14-6-2 4-18 10-16 14-16 19-2z"/>
      <path fill="none" stroke="#F6EFE3" stroke-width="1.15" opacity=".85" d="M76 42c12 16 18 44 12 72-6 26-22 44-36 48-12-10-16-34-10-58 6-24 8-44 18-56 6-6 12-10 16-6z"/>
      <circle cx="64" cy="96" r="3.4" fill="#E43778"/>
    </symbol>
    <symbol id="bloom" viewBox="-20 -20 40 40">
      <g fill="currentColor">
        <ellipse cx="0" cy="0" rx="4.1" ry="13"/>
        <ellipse cx="0" cy="0" rx="4.1" ry="13" transform="rotate(60)"/>
        <ellipse cx="0" cy="0" rx="4.1" ry="13" transform="rotate(120)"/>
      </g>
      <circle r="3.4" fill="#E8B54A"/>
      <circle r="1.5" fill="#541028"/>
    </symbol>
    <symbol id="leaf" viewBox="-20 -9 40 18">
      <path fill="currentColor" d="M-17 0C-8-9 8-8 17 0 8 8-8 9-17 0z"/>
      <path d="M-11 0H12" stroke="#F6EFE3" stroke-width=".8" fill="none" opacity=".75"/>
    </symbol>
    <symbol id="dot" viewBox="-4 -4 8 8">
      <circle r="2.3" fill="currentColor"/>
    </symbol>
  </defs>

  <!-- edge-wrapped butas: identical transform on opposite edges so the tile seams -->
  <g transform="translate(320 0) rotate(-18) scale(.72)" color="#A41650"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(320 640) rotate(-18) scale(.72)" color="#A41650"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(0 320) rotate(72) scale(.72)" color="#8E163C"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(640 320) rotate(72) scale(.72)" color="#8E163C"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>

  <!-- corner blooms -->
  <g transform="translate(0 0) scale(1.15)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(640 0) scale(1.15)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(0 640) scale(1.15)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(640 640) scale(1.15)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>

  <!-- quarter-edge blooms -->
  <g transform="translate(160 0)" color="#E43778"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(480 0)" color="#1F7A72"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(160 640)" color="#E43778"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(480 640)" color="#1F7A72"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(0 160)" color="#1F7A72"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(0 480)" color="#E8B54A"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(640 160)" color="#1F7A72"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(640 480)" color="#E8B54A"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>

  <!-- interior field -->
  <g transform="translate(168 168) rotate(-24) scale(1.08)" color="#E43778"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(468 132) rotate(16) scale(.82)" color="#C41658"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(250 455) rotate(162) scale(.96)" color="#8E163C"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(500 470) rotate(-148) scale(.7)" color="#A41650"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(78 78) rotate(200) scale(.48)" color="#6E1234"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(560 250) rotate(-50) scale(.46)" color="#E43778"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(340 330) rotate(28) scale(.5)" color="#F2C56A"><use href="#buta-line" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(120 340) rotate(48) scale(.42)"><use href="#buta-line" x="-60" y="-100" width="120" height="200"/></g>
  <g transform="translate(430 250) rotate(-8) scale(.38)" color="#7D96B3"><use href="#buta" x="-60" y="-100" width="120" height="200"/></g>

  <!-- leaves -->
  <g transform="translate(250 120) rotate(-20)" color="#1F7A72"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(300 150) rotate(18) scale(.8)" color="#0E5C56"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(390 200) rotate(40)" color="#1F7A72"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(140 250) rotate(-40) scale(.85)" color="#146E66"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(520 360) rotate(12)" color="#1F7A72"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(200 520) rotate(70) scale(.75)" color="#0E5C56"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(360 540) rotate(-30)" color="#1F7A72"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(90 500) rotate(24) scale(.7)" color="#146E66"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(560 80) rotate(-55)" color="#1F7A72"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>
  <g transform="translate(40 200) rotate(30) scale(.8)" color="#0E5C56"><use href="#leaf" x="-20" y="-9" width="40" height="18"/></g>

  <!-- small flowers in the gaps -->
  <g transform="translate(300 80) scale(.72)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(400 90) scale(.55)" color="#E8B54A"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(90 150) scale(.66)" color="#E43778"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(230 280) scale(.5)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(530 180) scale(.62)" color="#F2C56A"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(150 430) scale(.58)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(380 400) scale(.7)" color="#E43778"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(300 560) scale(.55)" color="#1F7A72"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(470 560) scale(.48)" color="#7D96B3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(50 400) scale(.5)" color="#E8B54A"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(580 430) scale(.58)" color="#E43778"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>
  <g transform="translate(250 50) scale(.42)" color="#F6EFE3"><use href="#bloom" x="-20" y="-20" width="40" height="40"/></g>

  <!-- seed dots -->
  <g color="#E8B54A">
    <use href="#dot" x="40" y="40" width="8" height="8"/>
    <use href="#dot" x="210" y="40" width="8" height="8"/>
    <use href="#dot" x="400" y="40" width="8" height="8"/>
    <use href="#dot" x="580" y="50" width="8" height="8"/>
    <use href="#dot" x="40" y="300" width="8" height="8"/>
    <use href="#dot" x="600" y="300" width="8" height="8"/>
    <use href="#dot" x="100" y="600" width="8" height="8"/>
    <use href="#dot" x="280" y="600" width="8" height="8"/>
    <use href="#dot" x="500" y="610" width="8" height="8"/>
    <use href="#dot" x="360" y="250" width="8" height="8"/>
    <use href="#dot" x="180" y="360" width="8" height="8"/>
    <use href="#dot" x="520" y="500" width="8" height="8"/>
  </g>
  <g color="#F6EFE3" opacity=".85">
    <use href="#dot" x="130" y="100" width="8" height="8"/>
    <use href="#dot" x="450" y="70" width="8" height="8"/>
    <use href="#dot" x="70" y="250" width="8" height="8"/>
    <use href="#dot" x="560" y="140" width="8" height="8"/>
    <use href="#dot" x="300" y="200" width="8" height="8"/>
    <use href="#dot" x="420" y="480" width="8" height="8"/>
    <use href="#dot" x="200" y="500" width="8" height="8"/>
    <use href="#dot" x="80" y="560" width="8" height="8"/>
  </g>
</svg>
